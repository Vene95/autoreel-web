  <!--
    Smart App Banner (iOS/Safari).
    ================================================================
    O linie care rezolvă o gaură reală: până acum, TOATE linkurile
    distribuite din aplicație duceau aici (`Env.appPublicUrl` =
    app.autoreel.ro), iar pagina nu avea NICIO cale spre App Store.
    În App Store Connect → Analytics → Source Type, „Web Referrer" era
    gol pe trei luni. Zero oameni ajunși în magazin din postări.

    Safari afișează bara nativă Apple în capul paginii, cu buton de
    instalare — sau „Deschide", dacă aplicația e deja instalată
    (funcționează prin Universal Links, deja configurate pentru acest
    domeniu în .well-known/apple-app-site-association).

    ID-ul e cel din URL-ul App Store:
    apps.apple.com/ro/app/autoreel-marketplace-auto/id6781619559
  -->
  <meta name="apple-itunes-app" content="app-id=6781619559">

  <!-- iOS meta tags & icons -->

  <style id="splash-screen-style">
    html { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      /* IMPORTANT: păstrat constant #0E0E14 inclusiv DUPĂ removeSplashFromWeb().
         Anterior, splash removal seta body.style.background = "transparent",
         dar până când Flutter Web picta primul frame, se vedea fundalul HTML
         default (alb în Chrome desktop) → flash alb urât de 100-400 ms după
         dispariția splash-ului. Match cu tema dark a app-ului = zero gap. */
      background-color: #0E0E14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Splash text-based (NU picture+img). Inline 100%, zero dependență de
       resurse externe → funcționează identic pe toate browser-ele (inclusiv
       Safari iOS cu Advanced Privacy Protection care bloca imaginea PNG).

       Background, font, logo — toate hardcoded inline.
       Fade-out smooth la `removeSplashFromWeb()`. */
    #splash {
      position: fixed;
      inset: 0;
      background-color: #0E0E14;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #splash .logo-text {
      font-size: clamp(48px, 12vw, 96px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      /* Pulse subtle pentru a indica "loading" fără spinner intrusiv */
      animation: splash-pulse 1.6s ease-in-out infinite;
    }
    #splash .logo-auto { color: #F5F5FA; }
    #splash .logo-reel { color: #FF6A00; }

    @keyframes splash-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.65; }
    }

    @media (prefers-color-scheme: dark) {
      body { background-color: #0E0E14; }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (splash) {
        // Adăugăm clasa fade-out → declanșează tranziția CSS 0.25s.
        // După tranziție, scoatem elementul din DOM ca să eliberăm memoria.
        splash.classList.add("fade-out");
        setTimeout(() => splash.remove(), 250);
      }
      document.getElementById("splash-branding")?.remove();
      // NU mai facem body.style.background = "transparent" — fundalul
      // body rămâne #0E0E14 până când Flutter Web pictează scaffold-ul.
      // Asta elimină flash-ul alb scurt de pe desktop între dispariția
      // splash-ului și primul frame al app-ului.
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <!-- Splash inline text-only. Zero PNG, zero srcset, zero loading risk.
       Renderează instant pe orice browser/device. -->

      <span class="logo-auto">Auto</span><span class="logo-reel">Reel</span>
    </div>
  </div>

  <!--
    Bară de instalare pentru ANDROID.
    ================================================================
    Pe iOS nu e nevoie de nimic aici: `apple-itunes-app` din <head> pune
    bara nativă a lui Apple. Pe Android însă, Chrome NU mai afișează un
    banner de aplicație nativă doar pe baza manifestului — de aia bara
    de mai jos e scrisă de mână.

    Reguli de afișare, ca să nu fie agresivă:
      • doar pe Android, în browser (nu în PWA instalat)
      • o singură dată; „×" ține minte refuzul în localStorage
      • apare după 1,2 secunde, ca să nu concureze cu primul frame Flutter

    Fără dependențe, fără framework. Se șterge complet ștergând acest bloc.
  -->
  <style>
    #ar-install{position:fixed;top:0;left:0;right:0;z-index:2147483000;
      display:none;align-items:center;gap:12px;padding:10px 12px;
      background:#17171c;border-bottom:1px solid #2c2c34;
      font:500 14px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.45)}
    #ar-install img{width:38px;height:38px;border-radius:9px;flex:0 0 auto}
    #ar-install .ar-t{flex:1 1 auto;min-width:0}
    #ar-install .ar-t b{display:block;font-weight:700}
    #ar-install .ar-t span{color:#9a9aa4;font-size:12px}
    #ar-install a{flex:0 0 auto;background:#FF6A00;color:#fff;text-decoration:none;
      font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px}
    #ar-install button{flex:0 0 auto;background:none;border:0;color:#75757e;
      font-size:22px;line-height:1;padding:4px 6px;cursor:pointer}
  </style>
  <div id="ar-install" role="region" aria-label="Instalează aplicația AutoReel">
    <img src="icons/Icon-192.png" alt="">
    <div class="ar-t"><b>AutoReel</b><span>Mai rapid în aplicație</span></div>
    <a id="ar-install-link" href="#">Instalează</a>
    <button type="button" id="ar-install-x" aria-label="Închide">&times;</button>
  </div>
  <script>
    (function () {
      var KEY = 'ar_install_bar_dismissed_v1';
      try {
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        // `standalone` = PWA deja instalat; nu-l mai batem la cap.
        var standalone = window.matchMedia &&
          window.matchMedia('(display-mode: standalone)').matches;
        if (!isAndroid || standalone) return;
        if (localStorage.getItem(KEY) === '1') return;

        var bar = document.getElementById('ar-install');
        var link = document.getElementById('ar-install-link');
        // `referrer` cu UTM ca instalările să apară atribuit în Play Console,
        // altfel nu ai cum să știi dacă bara asta a produs ceva.
        link.href = 'https://play.google.com/store/apps/details' +
          '?id=com.autoreel.autoreel' +
          '&referrer=' + encodeURIComponent(
            'utm_source=webapp&utm_medium=install_bar&utm_campaign=app_autoreel_ro');

        document.getElementById('ar-install-x').addEventListener('click', function () {
          bar.style.display = 'none';
          try { localStorage.setItem(KEY, '1'); } catch (e) {}
        });

        setTimeout(function () { bar.style.display = 'flex'; }, 1200);
      } catch (e) {
        // Orice eroare aici NU are voie să afecteze aplicația.
        if (window.console) console.warn('[install bar]', e);
      }
    })();
  </script>

</body></html>
